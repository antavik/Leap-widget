# swiftlint config for Leap — tailored, low-noise.
# philosophy: disable only rules that fight deliberate project conventions; keep every
# rule that surfaces a real, fixable finding on. one budget for sources and tests —
# the biggest file is a snapshot test suite (LeapCoreTests/Rendering/ConfigurationChangeTests.swift).

excluded:
  - build                       # xcodebuild DerivedData
  - LeapCore/.build             # SwiftPM build
  - Leap.xcodeproj              # generated by XcodeGen
  - reports                     # test reports

disabled_rules:
  - identifier_name             # short local names (x, y, l, r) are deliberate in geometry and pixel loops
  - trailing_comma              # style preference, not a defect
  - optional_data_string_conversion # we want lossy String(decoding:as:) for process output
                                    # (best-effort, never nil), not the failable initializer

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true
  excluded_lines_patterns:
    - '"[^"]{60,}"'             # localized and log strings stay on one line so they read and grep whole

file_length:
  warning: 500
  error: 600
type_body_length:
  warning: 400                  # snapshot test suites
  error: 500
function_body_length:
  warning: 60
  error: 100

nesting:
  type_level: 2                 # namespaced constants (Constants.Mail.Subject) nest 2 deep

large_tuple:
  warning: 3                    # 3-member returns (RGB triples) are fine; 4+ should become a struct
  error: 5
